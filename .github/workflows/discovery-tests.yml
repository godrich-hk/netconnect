name: Discovery integration
on:
  push:
    paths:
      - 'tests/HamResan.Discovery.Tests/**'
      - '.github/workflows/discovery-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mdns-loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish and browse a local DNS-SD service
        shell: bash
        run: |
          set +e
          dotnet run --project tests/HamResan.Discovery.Tests/HamResan.Discovery.Tests.csproj -c Release > mdns-test.log 2>&1
          result=$?
          cat mdns-test.log
          if [ "$result" -ne 0 ]; then
            grep -Ei 'exception|error|failed|failure' mdns-test.log | head -8 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$result"
          fi
