name: Diagnose previous Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  old-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the APK previously supplied to the user
        uses: actions/download-artifact@v4
        with:
          name: experimental-android
          path: previous-apk
          github-token: ${{ github.token }}
          run-id: 42872149942
      - name: Inspect APK managed assemblies
        shell: bash
        run: |
          apk=$(find previous-apk -name '*-Signed.apk' -print -quit)
          test -n "$apk"
          echo "APK: $apk"
          unzip -l "$apk" | grep -E 'assembl|libmonodroid|libdotnet' | head -100 || true
          if ! unzip -l "$apk" | grep -Eq 'assemblies\.blob|assemblies/.*\.dll|libassemblies\.'; then
            echo '::warning::No embedded managed assembly bundle was found in the APK.'
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch previously supplied APK on Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./scripts/android-smoke.sh "$(find previous-apk -name '*-Signed.apk' -print -quit)"
