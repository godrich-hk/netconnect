name: Check mDNS package availability
on:
  push:
    paths:
      - '.github/workflows/check-mdns-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check stable NuGet package versions
        run: |
          python3 - <<'PY'
          import json, urllib.request
          for package in ('xamarin.androidx.core', 'xamarin.androidx.core.ktx', 'xamarin.androidx.collection.ktx', 'xamarin.androidx.lifecycle.runtime.ktx', 'xamarin.androidx.lifecycle.viewmodel.ktx', 'xamarin.androidx.lifecycle.livedata.core'):
              try:
                  obj = json.load(urllib.request.urlopen(f'https://api.nuget.org/v3-flatcontainer/{package}/index.json', timeout=30))
                  stable = [v for v in obj['versions'] if '-' not in v]
                  print(f'::notice::{package}: stable versions {stable[-6:]}')
              except Exception as e:
                  print(f'::warning::{package}: {e}')
          PY
      - name: Inspect published package
        run: |
          curl -fsSL https://api.nuget.org/v3-flatcontainer/shiny.net.discovery/6.5.2/shiny.net.discovery.6.5.2.nupkg -o /tmp/mdns.nupkg
          unzip -l /tmp/mdns.nupkg | grep -E 'lib/.*\.(dll|xml)' | head -25 | while read -r line; do echo "::notice::$line"; done
          unzip -p /tmp/mdns.nupkg lib/net10.0/Shiny.Net.Discovery.xml > /tmp/mdns.xml || true
          grep -E 'IMdnsManager|AddMdns|MdnsServiceRegistration|MdnsBrowseConfig' /tmp/mdns.xml | head -20 | while read -r line; do echo "::notice::$line"; done || true
