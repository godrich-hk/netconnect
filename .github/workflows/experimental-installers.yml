name: Experimental installers
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installers:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-windows --skip-manifest-update
      - name: Publish Android debug APK
        run: dotnet publish src/HamResan.App/HamResan.App.csproj -f net10.0-android -c Debug -p:AndroidPackageFormats=apk -o "${{ github.workspace }}\artifacts\android"
      - name: Publish Windows x64 app
        run: dotnet publish src/HamResan.App/HamResan.App.csproj -f net10.0-windows10.0.19041.0 -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -o "${{ github.workspace }}\artifacts\windows"
      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:HAMRESAN_PUBLISH = "${{ github.workspace }}\artifacts\windows"
          $env:HAMRESAN_INSTALLER_OUTPUT = "${{ github.workspace }}\artifacts\installer"
          New-Item -ItemType Directory -Force $env:HAMRESAN_INSTALLER_OUTPUT | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          & $iscc packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-installers
          path: |
            artifacts/android/*-Signed.apk
            artifacts/installer/HamResan-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 7
