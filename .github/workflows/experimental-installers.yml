name: Experimental installers
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-windows --skip-manifest-update
      - name: Publish Android debug APK
        shell: pwsh
        run: |
          dotnet publish src/HamResan.App/HamResan.App.csproj -f net10.0-android -c Debug -p:AndroidPackageFormats=apk -o "${{ github.workspace }}\artifacts\android" 2>&1 | Tee-Object -FilePath android-build.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $errors = @(Select-String -Path android-build.log -Pattern 'error |: error|exception|failed' | Select-Object -Last 8)
            if ($errors.Count -eq 0) { $errors = @(Get-Content android-build.log -Tail 8) }
            $errors | ForEach-Object { Write-Output "::error::$($_ -replace '%','%25' -replace '\r','%0D' -replace '\n','%0A')" }
            exit $result
          }
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-android
          path: artifacts/android/*-Signed.apk
          if-no-files-found: error
          retention-days: 7
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Publish Windows x64 app
        shell: pwsh
        run: |
          dotnet publish src/HamResan.App/HamResan.App.csproj -f net10.0-windows10.0.19041.0 -p:WindowsOnlyBuild=true -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -o "${{ github.workspace }}\artifacts\windows" 2>&1 | Tee-Object -FilePath windows-build.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            Get-Content windows-build.log -Tail 60 | ForEach-Object { Write-Output "::error::$($_ -replace '%','%25' -replace '\r','%0D' -replace '\n','%0A')" }
            exit $result
          }
      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:HAMRESAN_PUBLISH = "${{ github.workspace }}\artifacts\windows"
          $env:HAMRESAN_INSTALLER_OUTPUT = "${{ github.workspace }}\artifacts\installer"
          New-Item -ItemType Directory -Force $env:HAMRESAN_INSTALLER_OUTPUT | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          & $iscc packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-windows
          path: artifacts/installer/HamResan-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 7

  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: experimental-android
          path: apk
      - name: Verify the standalone APK contains assemblies and ARM64 runtime
        shell: bash
        run: |
          apk=$(find apk -name '*-Signed.apk' -print -quit)
          test -n "$apk"
          unzip -l "$apk" > apk-contents.txt
          if ! grep -Eq 'assemblies\.blob|assemblies/.*\.dll|libassemblies\.|lib/arm64-v8a/lib_HamResan\.App\.dll\.so' apk-contents.txt; then
            echo '::error::The APK does not contain embedded managed assemblies.'; exit 1
          fi
          if ! grep -q 'lib/arm64-v8a/' apk-contents.txt; then
            echo '::error::The APK does not contain ARM64 native libraries.'; exit 1
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch APK on Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./scripts/android-smoke.sh "$(find apk -name '*-Signed.apk' -print -quit)"
