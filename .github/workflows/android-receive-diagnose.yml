name: Android receive diagnostic
on:
  push:
    paths:
      - 'scripts/android-receive-smoke.sh'
      - '.github/workflows/android-receive-diagnose.yml'
permissions:
  contents: read
  actions: read
jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: experimental-android
          path: apk
          github-token: ${{ github.token }}
          run-id: 43001564026
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build test sender
        run: dotnet build tests/HamResan.Android.Integration/HamResan.Android.Integration.csproj -c Release
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise receiver in Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./scripts/android-smoke.sh "$(find apk -name '*-Signed.apk' -print -quit)" && ./scripts/android-transfer-smoke.sh
