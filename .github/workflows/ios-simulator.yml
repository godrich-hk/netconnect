name: iOS simulator prototype
on:
  push:
    paths:
      - 'src/HamResan.App/**'
      - 'src/HamResan.Core/**'
      - '.github/workflows/ios-simulator.yml'
      - 'global.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Report build tools
        run: |
          dotnet --info
          xcodebuild -version
          uname -m
      - name: Install iOS workload
        run: dotnet workload install maui-ios --skip-manifest-update
      - name: Build unsigned simulator application
        shell: bash
        run: |
          if [ "$(uname -m)" = arm64 ]; then rid=iossimulator-arm64; else rid=iossimulator-x64; fi
          set +e
          dotnet build src/HamResan.App/HamResan.App.csproj -f net10.0-ios -p:IosOnlyBuild=true -c Debug -r "$rid" -p:EnableCodeSigning=false > ios-build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            grep -iE 'error |: error|exception|failed' ios-build.log | head -8 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$result"
          fi
          echo "Built an unsigned $rid simulator app. No installable device IPA was created."
      - name: Install and launch on iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; echo "::error::Command failed at line $LINENO: $BASH_COMMAND (exit $rc)"; exit "$rc"' ERR
          run_logged() {
            local output rc=0
            output=$("$@" 2>&1) || rc=$?
            if [ "$rc" -ne 0 ]; then
              while IFS= read -r line; do
                line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}
                echo "::error::$line" >&2
              done <<< "$output"
              return "$rc"
            fi
            printf '%s\n' "$output"
          }
          udid=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for r,ds in d["devices"].items() if ".iOS-" in r for x in ds if x["name"].startswith("iPhone") and x.get("isAvailable")),""))')
          if [ -z "$udid" ]; then echo '::error::No available iPhone simulator runtime was found.'; exit 1; fi
          app=$(find src/HamResan.App/bin/Debug -type d -name 'HamResan.App.app' -print -quit)
          if [ -z "$app" ]; then echo '::error::Simulator app bundle not found.'; exit 1; fi
          # The simulator can install an unsigned bundle but SplashBoard may reject its resources.
          # Ad-hoc signing is for the simulator only; it is not a signed device IPA.
          run_logged codesign --force --deep --sign - "$app"
          run_logged codesign --verify --deep --strict "$app"
          trap 'xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$udid" || true
          run_logged xcrun simctl bootstatus "$udid" -b
          run_logged xcrun simctl install "$udid" "$app"
          launch=$(run_logged xcrun simctl launch "$udid" com.hamresan.app)
          pid=${launch##*: }
          case "$pid" in (*[!0-9]*|'') echo '::error::Could not obtain the simulator process ID.'; exit 1;; esac
          sleep 15
          if ! ps -p "$pid" >/dev/null; then
            echo '::error::The simulator app exited shortly after launch.'
            # CI logs are emitted as annotations as well because raw job logs may be inaccessible.
            diagnostics=$(mktemp)
            xcrun simctl spawn "$udid" log show --last 5m --style compact --predicate 'process == "HamResan.App" OR eventMessage CONTAINS[c] "HamResan.App"' > "$diagnostics" 2>&1 || true
            for report in "$HOME"/Library/Logs/DiagnosticReports/HamResan*.ips; do
              if [ -f "$report" ]; then cat "$report" >> "$diagnostics"; fi
            done
            grep -iE 'exception|fatal|abort|crash|signal|terminat|error' "$diagnostics" | tail -30 | cut -c 1-600 | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}
              echo "::error::$line"
            done || true
            rm -f "$diagnostics"
            exit 1
          fi
          echo 'PASS: iOS simulator app was installed, launched and remained running.'
