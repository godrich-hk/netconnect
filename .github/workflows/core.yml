name: Core checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build core and test harness
        run: dotnet build tests/HamResan.Core.Tests/HamResan.Core.Tests.csproj --configuration Release
      - name: Run core checks
        run: dotnet run --project tests/HamResan.Core.Tests/HamResan.Core.Tests.csproj --configuration Release --no-build
